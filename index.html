<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#0A0C10;
  --surface:#14171D;
  --surface-2:#1B1F27;
  --surface-3:#252A34;
  --border:#262B34;
  --border-soft:#1D2129;
  --text:#ECEEF1;
  --text-muted:#8B93A0;
  --text-faint:#565D69;
  --teal:#3ECFC0;
  --teal-dim:#16302C;
  --amber:#E8AA4A;
  --amber-dim:#332815;
  --coral:#E8685C;
  --coral-dim:#331E1B;
  --violet:#9B87F5;
  --blue:#5B9FE8;
  --violet-dim:#251F3D;
  --onsite:#E85CC8;
  --onsite-dim:#3A1E33;
  --display:'Space Grotesk',sans-serif;
  --body:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --shadow-sm:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 6px rgba(0,0,0,.35);
  --shadow-md:0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;transition:background .15s;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}
button,.btn,.tab-btn,.filter-chip,.notif-tab-btn,select.cell-input,input.cell-input,.mini-badge,.prior-badge{transition:background-color .12s ease,border-color .12s ease,color .12s ease,opacity .12s ease,box-shadow .12s ease;}
.roster-tag,.user-row,.notif-row{transition:background-color .12s ease;}

.app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
@media (max-width:480px){
  .app{padding:16px 12px 60px;}
  .header h1{font-size:21px;}
  .header .sub{font-size:12px;}
  .summary .cell{padding:10px 8px;}
  .summary .cell .num{font-size:18px;}
  .tab-btn{font-size:12px;padding:7px 10px;}
  .date-row .btn.primary{font-size:11px;padding:8px 10px;}
}

/* MOBILE CARD VIEW — transforms the calls table into stacked cards below 700px,
   so assigning calls on a phone never needs horizontal scrolling. Reuses the
   exact same <tr>/<td> markup and data-field attributes as the desktop table,
   so every editing/selection handler keeps working unchanged — only the CSS
   display mode changes. Label sits above each cell's content (rather than
   side-by-side) so it stays clean regardless of how many elements — icons,
   badges, inputs — a given cell contains. */
@media (max-width:700px){
  .table-scroll{overflow-x:visible;}
  table{min-width:unset;width:100%;border-radius:0;border:none;background:transparent;}
  thead{display:none;}
  tbody{display:flex;flex-direction:column;gap:10px;}
  tbody tr{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 14px;}
  tbody tr.row-unassigned{background:var(--coral-dim);}
  tbody tr.doubt-note-row{background:var(--amber-dim);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  tbody tr.doubt-note-row td{display:block;padding:0;border:none;}
  td{display:block;padding:9px 0;border-bottom:1px solid var(--border-soft);}
  tr td:last-child{border-bottom:none;}
  td::before{content:attr(data-label);display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:600;margin-bottom:4px;}
  td.select-cell::before{content:"Select";}
  td.actions-cell{display:flex;justify-content:flex-end;gap:6px;}
  td.actions-cell::before{display:none;}
  td .cell-input{width:100%;text-align:left;}
}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap;position:relative;padding-top:30px;}
.account-chip{position:absolute;top:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 8px 6px 14px;box-shadow:var(--shadow-sm);font-size:12.5px;}
.account-chip .account-name{color:var(--text);font-weight:600;white-space:nowrap;}
.account-chip .account-role{color:var(--text-faint);font-size:11px;white-space:nowrap;}
.account-chip .account-logout-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--coral);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;cursor:pointer;white-space:nowrap;}
.account-chip .account-logout-btn:hover{border-color:var(--coral);}
@media (max-width:640px){
  .account-chip{position:static;margin:0 0 12px;justify-content:space-between;box-shadow:none;}
}
.scroll-to-top-btn{position:fixed;bottom:22px;right:20px;z-index:70;width:44px;height:44px;border-radius:50%;background:var(--teal-dim);border:1px solid #1F4A43;color:var(--teal);font-size:20px;line-height:1;cursor:pointer;box-shadow:var(--shadow-md);display:none;align-items:center;justify-content:center;transition:border-color .12s,opacity .12s;}
.scroll-to-top-btn:hover{border-color:var(--teal);}
.scroll-to-top-btn.visible{display:flex;}
.header h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:-0.02em;}
.header .sub{color:var(--text-muted);font-size:13px;}
.date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.more-menu-wrap{position:relative;}
.more-menu-dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:220px;}
.more-menu-item{background:none;border:none;color:var(--text);font-family:var(--body);font-size:13px;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.more-menu-item:hover{background:var(--surface-2);}
.more-menu-item:disabled{opacity:.5;cursor:default;}
.date-row input[type=date]{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:7px 10px;border-radius:8px;}
.date-row .arrow-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.date-row .arrow-btn:hover{color:var(--text);border-color:var(--text-faint);}

/* TABS */
.tabs-wrap{position:relative;margin-bottom:16px;}
.tabs-wrap.is-overflowing::after{content:'';position:absolute;top:0;right:0;bottom:0;width:28px;background:linear-gradient(to right, transparent, var(--bg) 85%);pointer-events:none;border-radius:0 10px 10px 0;}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;width:fit-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab-btn{white-space:nowrap;}
.tab-btn{background:transparent;border:none;color:var(--text-muted);font-family:var(--body);font-size:13px;font-weight:500;padding:8px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.tab-btn.active{background:var(--surface-3);color:var(--text);}
.tab-btn .n{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
.tab-btn.active .n{color:var(--teal);}

/* LOGIN */
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;width:100%;max-width:340px;}
.save-pending{background:var(--amber-dim);border-color:#5A4A1E;color:var(--amber);animation:pulse-save 1.6s ease-in-out infinite;}
.read-only-mode .cell-input,
.read-only-mode select.cell-input,
.read-only-mode input.time-input{pointer-events:none;opacity:.6;}
.read-only-mode .row-select,
.read-only-mode .move-2nd,
.read-only-mode .row-del,
.read-only-mode .resolve-doubt{display:none;}
.read-only-mode .pin-toggle,
.read-only-mode .pin-interviewer,
.read-only-mode .pin-technical-poc,
.read-only-mode .pin-importance{pointer-events:none;opacity:.5;}
.read-only-badge{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:8px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;}
.users-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.user-row{background:var(--surface);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.user-name{font-weight:600;font-size:13px;flex:1;min-width:100px;}
.undo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:100;}
.undo-toast button{background:var(--teal);color:#FFFFFF;border:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:pointer;}
.shift-note-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:16px;}
.shift-note-box label{display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.shift-note-box textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;resize:vertical;min-height:44px;}
@keyframes pulse-save{0%,100%{opacity:1;}50%{opacity:.6;}}

/* SEARCH */
.search-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:16px;}
.bulk-bar{display:flex;align-items:center;gap:10px;background:var(--teal-dim);border:1px solid #1F4A43;border-radius:10px;padding:10px 14px;margin-bottom:16px;flex-wrap:wrap;}
.bulk-count{font-size:12.5px;font-weight:600;color:var(--teal);}
.select-cell{text-align:center;}
.select-cell input, th input[type=checkbox]{cursor:pointer;}
.summary-panel{max-width:520px;}
.summary-big-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
.summary-big-cell{background:var(--surface-2);border-radius:10px;padding:12px 6px;text-align:center;}
.summary-big-num{font-family:var(--mono);font-size:22px;font-weight:600;}
.summary-big-lbl{font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
.summary-big-cell.sbg-teal .summary-big-num{color:var(--teal);}
.summary-big-cell.sbg-coral .summary-big-num{color:var(--coral);}
.summary-big-cell.sbg-amber .summary-big-num{color:var(--amber);}
.summary-big-cell.sbg-violet .summary-big-num{color:var(--violet);}
.summary-detail-row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--border-soft);font-size:13px;}
.summary-detail-row:last-child{border-bottom:none;}
.search-icon{font-size:13px;opacity:.6;}
.search-box{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--body);font-size:14px;outline:none;}
.search-box::placeholder{color:var(--text-faint);}
.search-clear{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;padding:2px 6px;}
.search-clear:hover{color:var(--coral);}
.search-count{font-family:var(--mono);font-size:11px;color:var(--teal);white-space:nowrap;}

/* SUMMARY STRIP */
.summary{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-sm);}
.team-load-strip{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.team-load-cell{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text-muted);}
.team-load-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.team-load-num{font-family:var(--mono);font-size:15px;color:var(--text);margin-left:4px;}
.summary .cell{flex:1 0 auto;min-width:84px;background:var(--surface);padding:14px 16px;}
.summary .cell .num{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1;}
.summary .cell .lbl{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}
.summary .cell.total .num{color:var(--text);}
.summary .cell.assigned .num{color:var(--teal);}
.summary .cell.unassigned .num{color:var(--coral);}
.summary .cell.woi .num{color:var(--amber);}
.summary .cell.conflict .num{color:var(--violet);}

/* COVERAGE STRIP (signature element) */
.strip-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px 12px;margin-bottom:20px;}
.strip-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:12px;display:flex;justify-content:space-between;}
.strip{display:flex;align-items:flex-end;gap:3px;height:64px;}
.strip .hour{flex:0 0 46px;display:flex;flex-direction:column-reverse;gap:1px;min-width:46px;border-radius:2px 2px 0 0;overflow:visible;position:relative;cursor:default;}
.hour-free-dot{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;}
.strip-hint{font-size:10.5px;color:var(--text-faint);margin-top:14px;text-align:center;}
.strip .hour .seg{width:100%;min-height:3px;}
.hour-lbl{font-family:var(--mono);font-size:8px;color:var(--text-faint);text-align:center;margin-top:6px;flex:0 0 46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.strip-hours{display:flex;gap:3px;}
.strip-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
.strip-scroll::-webkit-scrollbar{height:8px;}
.strip-scroll::-webkit-scrollbar-thumb{background:var(--teal-dim);border-radius:4px;}
.strip-scroll::-webkit-scrollbar-thumb:hover{background:var(--teal);}
.strip-empty{color:var(--text-faint);font-size:12px;font-family:var(--mono);padding:10px 0;}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
.btn:hover{border-color:var(--text-faint);box-shadow:var(--shadow-md);}
.btn.primary{background:var(--teal-dim);border-color:#1F4A43;color:var(--teal);font-weight:600;}
.btn.primary:hover{border-color:var(--teal);}
.btn.ghost{background:transparent;box-shadow:none;}
.spacer{flex:1;}
.filter-chip{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:var(--body);}
.filter-chip.active{background:var(--surface-3);color:var(--text);border-color:var(--text-faint);}
.filter-chip .n{font-family:var(--mono);opacity:.7;margin-left:4px;}

/* IMPORT PANEL */
@keyframes panel-fade-in{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:translateY(0);}}
.import-panel{animation:panel-fade-in .15s ease;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes row-jump-flash{0%,100%{background:transparent;}30%,70%{background:var(--teal-dim);}}
tr.row-jump-highlight{animation:row-jump-flash 1.4s ease-in-out 2;}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.25);border-top-color:currentColor;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-2px;margin-right:6px;}
.spinner-lg{width:28px;height:28px;border-width:3px;margin:0 auto;display:block;}
.loading-block{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 20px;color:var(--text-faint);font-size:13px;}
.skeleton-row{height:44px;border-radius:8px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:skeleton-pulse 1.4s ease infinite;margin-bottom:8px;}
@keyframes skeleton-pulse{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.import-panel textarea{width:100%;min-height:140px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;padding:12px;resize:vertical;}
.import-panel .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.import-panel .hint{color:var(--text-faint);font-size:11.5px;}
.resched-warning-banner{background:rgba(230,126,102,0.12);border:1px solid var(--coral);color:var(--coral);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
.resched-item{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface-2);}
.resched-item.unmatched{border-color:var(--coral);}
.resched-item .resched-raw{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-bottom:8px;white-space:pre-wrap;}
.resched-item .resched-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;margin-bottom:8px;}
.resched-item .resched-meta b{color:var(--text);}
.resched-item select{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-family:var(--body);font-size:12.5px;}
.resched-item .resched-flags{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;}
.resched-match-badge{color:var(--teal);font-size:11.5px;}
.resched-unmatch-badge{color:var(--coral);font-size:11.5px;}

/* ROSTER PANEL */
.roster-panel{animation:panel-fade-in .15s ease;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.roster-panel .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.roster-tag{background:var(--surface-3);border:1px solid var(--border);border-radius:20px;padding:5px 8px 5px 12px;font-size:12.5px;display:flex;align-items:center;gap:6px;}
.roster-tag-absent{opacity:.7;border-color:var(--coral);}
.absent-toggle{display:flex;align-items:center;cursor:pointer;}
.absent-toggle input{cursor:pointer;}
.absent-badge{color:var(--coral);font-size:10.5px;font-weight:600;}
.conflict-pair-card{border:1px solid var(--violet);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:var(--violet-dim);}
.conflict-pair-title{font-weight:700;font-size:13px;color:var(--violet);margin-bottom:10px;}
.conflict-pair-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
.conflict-pair-row:first-of-type{border-top:none;}
.conflict-pair-info{font-size:13px;flex:1;min-width:200px;}
.conflict-reassign{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:12.5px;min-width:160px;}
.workload-badge{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:8px;margin-left:5px;background:var(--surface-3);color:var(--text-faint);vertical-align:middle;}
.workload-badge.workload-low{background:var(--teal-dim);color:var(--teal);}
.workload-badge.workload-med{background:var(--amber-dim);color:var(--amber);}
.workload-badge.workload-high{background:var(--coral-dim);color:var(--coral);}
.roster-tag button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;line-height:1;padding:0;}
.roster-panel .add-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.roster-panel input[type=text]{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:var(--body);flex:1;}

/* TABLE */
table{width:100%;min-width:1050px;table-layout:fixed;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);}
@media (min-width:701px){
  /* Keep the action buttons (📌 →2nd ✕) reachable without scrolling all
     the way right, no matter how many columns exist — this is what was
     "misplaced" after the Portal Assignee column was added. */
  th:last-child, td.actions-cell{position:sticky;right:0;z-index:3;box-shadow:-6px 0 8px -6px rgba(0,0,0,0.35);}
  th:last-child{background:var(--surface-2);}
  td.actions-cell{background:var(--surface);}
  tbody tr.row-unassigned td.actions-cell{background:var(--coral-dim);}
}
th,td{overflow:hidden;text-overflow:ellipsis;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;}
.table-scroll-top{overflow-x:auto;overflow-y:hidden;height:7px;margin-bottom:5px;opacity:.45;transition:opacity .15s;}
.table-scroll-top:hover{opacity:1;}
.table-scroll-top::-webkit-scrollbar{height:5px;}
.table-scroll-top::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:3px;}
.table-scroll-top::-webkit-scrollbar-track{background:transparent;}
#tableScrollTopInner{height:1px;}
.table-scroll::-webkit-scrollbar{height:8px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);padding:10px 10px;border-bottom:1px solid var(--border);background:var(--surface-2);font-weight:600;}
tbody tr{border-bottom:1px solid var(--border-soft);}
tbody tr:last-child{border-bottom:none;}
tbody tr.row-unassigned{background:var(--coral-dim);}
tbody tr.row-conflict{outline:1px solid var(--violet);outline-offset:-1px;}
tbody tr.row-healthcare{box-shadow:inset 3px 0 0 var(--teal);}
tbody tr.row-education{box-shadow:inset 3px 0 0 var(--amber);}
tbody tr.row-onsite{box-shadow:inset -3px 0 0 var(--onsite);}
tbody tr.row-healthcare.row-onsite{box-shadow:inset 3px 0 0 var(--teal), inset -3px 0 0 var(--onsite);}
tbody tr.row-education.row-onsite{box-shadow:inset 3px 0 0 var(--amber), inset -3px 0 0 var(--onsite);}
tbody tr.row-long-duration td:nth-child(6){background:var(--violet-dim);}
.cat-badge{display:inline-block;font-size:12px;margin-right:4px;}
.prior-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:1px 4px;margin-right:5px;vertical-align:middle;cursor:default;}
.prior-badge-client{color:var(--amber);border-color:var(--amber);}
.badge-row{display:inline-flex;align-items:center;gap:3px;margin-right:4px;vertical-align:middle;}
.mini-badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:5px;font-size:9.5px;font-weight:700;line-height:1;cursor:default;flex-shrink:0;background:var(--surface-3);}
.mini-badge-prior{color:var(--blue);border:1px solid var(--blue);}
.mini-badge-round{color:var(--teal);border:1px solid var(--teal);}
.mini-badge-client{color:var(--amber);border:1px solid var(--amber);}
.mini-badge-resched{color:var(--coral);border:1px solid var(--coral);}
.mini-badge-newstudent{color:var(--text-muted);border:1px dashed var(--text-faint);cursor:pointer;}
.mini-badge-newstudent:hover{color:var(--text);border-color:var(--text-muted);}
.doubt-icon{color:var(--amber);}
.doubt-note-row td{background:var(--amber-dim);color:var(--amber);font-size:12px;padding:6px 12px;border-bottom:1px solid var(--border-soft);}
.doubt-note-icon{margin-right:5px;}
.status-note-row td{font-size:12px;padding:6px 12px;border-bottom:1px solid var(--border-soft);}
.status-note-row.status-note-rescheduled td{background:var(--violet-dim);color:var(--violet);}
.status-note-row.status-note-cancelled td{background:var(--coral-dim);color:var(--coral);}
.status-note-row.status-note-not_responded td{background:var(--amber-dim);color:var(--amber);}
.status-note-icon{margin-right:5px;}

.note-del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;padding:2px 6px;flex-shrink:0;}
.clear-status-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:0 4px;margin-right:4px;vertical-align:middle;}
.clear-status-btn:hover{color:var(--coral);}
.note-del:hover{color:var(--coral);}

/* NOTIFICATIONS */
.notif-alert{border-color:var(--coral) !important;color:var(--coral) !important;}
.notif-row{padding:10px 0;border-bottom:1px solid var(--border-soft);}
.notif-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.notif-tab-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:11.5px;font-weight:600;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.notif-tab-btn.active{background:var(--teal-dim);border-color:#1F4A43;color:var(--teal);}
.notif-tab-btn .n{margin-left:4px;opacity:.8;}
.notif-tab-content{min-height:60px;}
.notif-search{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;}
.notif-row:last-child{border-bottom:none;}
.notif-name{font-weight:600;font-size:13.5px;margin-bottom:4px;}
.notif-detail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.notif-chip{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11.5px;font-family:var(--mono);color:var(--text-muted);}
.notif-arrow{color:var(--text-faint);font-size:12px;}
.notif-row.notif-urgent{background:var(--coral-dim);border-radius:8px;padding:8px 10px;margin:0 -10px;}
.notif-warn{color:var(--coral);font-size:11px;font-weight:600;margin-left:4px;}
.resolve-doubt{background:none;border:none;color:var(--teal);cursor:pointer;font-size:13px;padding:2px 4px;}
.resolve-doubt:hover{color:var(--text);}
tbody td{padding:9px 10px;font-size:13px;vertical-align:middle;}
td.time{font-family:var(--mono);color:var(--text-muted);white-space:nowrap;font-size:12.5px;}
td input.cell-input, td select.cell-input{width:100%;background:transparent;border:1px solid transparent;color:var(--text);font-family:var(--body);font-size:13px;padding:5px 6px;border-radius:6px;}
td input.cell-input:hover, td select.cell-input:hover{border-color:var(--border);}
td input.cell-input:focus, td select.cell-input:focus{outline:none;border-color:var(--text-faint);background:var(--surface-2);}
select.cell-input{cursor:pointer;}
.driving-person-select{width:100%;background:transparent;border:1px solid transparent;color:var(--text);font-family:var(--body);font-size:13px;padding:5px 6px;border-radius:6px;cursor:pointer;}
.driving-person-select:hover{border-color:var(--border);}
.driving-person-select:focus{outline:none;border-color:var(--text-faint);background:var(--surface-2);}
.driving-person-select:disabled{cursor:default;opacity:.6;}
.driving-person-select option, .driving-person-select optgroup{background:var(--surface-2);color:var(--text);}
select.cell-input option, select.cell-input optgroup{background:var(--surface-2);color:var(--text);}
select.cell-input.empty{color:var(--coral);}
select.cell-input.team-level{font-style:italic;color:var(--text-muted);}
.badge{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 7px;border-radius:5px;white-space:nowrap;}
.badge.round1{background:var(--surface-3);color:var(--text-muted);}
.badge.round2{background:var(--teal-dim);color:var(--teal);}
.badge.roundfinal{background:var(--violet-dim);color:var(--violet);}
.round-input{font-family:var(--mono);font-size:9.5px;font-weight:600;border-radius:6px !important;padding:4px 4px !important;}
.round-input.round1{background:var(--surface-3);color:var(--text-muted);}
.round-input.round2{background:var(--teal-dim);color:var(--teal);}
.round-input.roundfinal{background:var(--violet-dim);color:var(--violet);}
.woi-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.onsite-toggle input{accent-color:var(--onsite);}
.woi-toggle input{accent-color:var(--amber);}
.woi-toggle span{font-size:11px;color:var(--text-muted);font-family:var(--mono);}
.flag-icon{color:var(--violet);font-size:12px;margin-right:4px;}
.row-del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:15px;padding:2px 6px;}
.row-del:hover{color:var(--coral);}
.move-2nd{background:var(--violet-dim);border:1px solid #3D3566;color:var(--violet);cursor:pointer;font-size:10.5px;padding:3px 6px;border-radius:5px;white-space:nowrap;margin-right:4px;}
.move-1st{background:var(--teal-dim);border:1px solid #1F4A43;color:var(--teal);cursor:pointer;font-size:10.5px;padding:3px 6px;border-radius:5px;white-space:nowrap;margin-right:4px;}
.move-1st:hover{border-color:var(--teal);}
.pin-toggle{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 5px;opacity:.4;filter:grayscale(1);margin-right:2px;}
.pin-toggle:hover{opacity:.8;}
.pin-toggle-filled{opacity:1;filter:none;}
.pin-detail-row td{padding:12px 14px !important;background:var(--surface-2);}
.pin-detail-fields{display:flex;gap:16px;flex-wrap:wrap;}

.pin-field label{display:block;font-size:10.5px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.pin-field input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;}
.move-2nd:hover{border-color:var(--violet);}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty-state h3{font-family:var(--display);color:var(--text-muted);font-weight:600;font-size:16px;margin-bottom:6px;}
.empty-state p{font-size:13px;margin:0 0 16px;}

.footer-note{margin-top:14px;font-size:11.5px;color:var(--text-faint);text-align:center;}

<body>
<div class="app" id="app"><div class="loading-block"><span class="spinner spinner-lg"></span><div>Loading Coverage Desk…</div></div></div>
<button id="scrollToTopBtn" class="scroll-to-top-btn" title="Scroll to top" aria-label="Scroll to top">↑</button>

<script>
const STATUS_COLORS = { assigned: 'var(--teal)', woi: 'var(--amber)', unassigned: 'var(--coral)' };
// Seeded once from the uploaded student-master spreadsheet — after the

function isAdvancedRound(round){
  // Anything that doesn't start with "1" (optionally "1st") counts as
  // advanced — deliberately not requiring a specific, correctly-spelled
  // ordinal suffix like "nd"/"rd"/"th", since real source data has typos
  // ("2ns Round" instead of "2nd Round") that a stricter check would miss,
  // causing the row to be misfiled into the 1st Round tab despite the badge
  // correctly showing it as an advanced round. This matches the same loose
  // rule already used for the round badge's color styling, so the two never
  // disagree with each other again.
  const r = (round||'').trim();
  if(!r) return false;
  return !/^1(st)?\b/i.test(r);
}

// ---------- storage adapter ----------
// Inside Claude's app/website, window.storage saves data to your Claude account.
// Opened standalone (system browser, downloaded file, hosted elsewhere), that
// API doesn't exist — this falls back to the browser's own localStorage instead,
// so the app still saves and reloads your data, just tied to that one browser/device.
const USE_CLAUDE_STORAGE = (typeof window !== 'undefined' && window.storage &&
  typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
const storageAdapter = {
  async get(key, shared){
    if(USE_CLAUDE_STORAGE) return window.storage.get(key, shared);
    const raw = localStorage.getItem('coverage-desk::'+key);
    if(raw===null) throw new Error('Key not found: '+key);
    return {key, value: raw, shared: !!shared};
  },
  async set(key, value, shared){
    if(USE_CLAUDE_STORAGE) return window.storage.set(key, value, shared);
    localStorage.setItem('coverage-desk::'+key, value);
    return {key, value, shared: !!shared};
  },
  async list(prefix, shared){
    if(USE_CLAUDE_STORAGE) return window.storage.list(prefix, shared);
    const fullPrefix = 'coverage-desk::'+(prefix||'');
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(fullPrefix)) keys.push(k.slice('coverage-desk::'.length));
    }
    return {keys, prefix, shared: !!shared};
  }
};

// ---------- optional remote MySQL API (Vercel backend) ----------
// If configured, calls/roster/notes/finalized all save to a real MySQL database
// via a small backend, instead of Claude storage or browser localStorage.
// DEFAULT_API_BASE_URL is baked in so that anyone who opens this file — on any
// device, any browser — automatically connects to the same shared database
// without needing to manually configure anything. The Database panel can still
// override it (e.g. to point at a different backend), and an explicit
// "disconnect" (saving a blank URL) is respected and remembered per-browser.
const DEFAULT_API_BASE_URL = 'https://coverage-desk-api.vercel.app';
let API_BASE_URL = DEFAULT_API_BASE_URL;
try{
  const saved = localStorage.getItem('coverage-desk-api-url');
  if(saved !== null) API_BASE_URL = saved; // respects an explicit disconnect (empty string)
}catch(e){}

let ADMIN_PASSWORD = '';
try{ ADMIN_PASSWORD = localStorage.getItem('coverage-desk-admin-pw') || ''; }catch(e){}
let CURRENT_USERNAME = '';
try{ CURRENT_USERNAME = localStorage.getItem('coverage-desk-username') || ''; }catch(e){}
let CURRENT_ROLE = 'admin'; // optimistic default; refined by refreshRole() once connected
let AUTH_FAILED = false; // set true when the backend rejects the current credentials

async function apiCall(resource, opts){
  const url = `${API_BASE_URL.replace(/\/$/,'')}/api/data?resource=${resource}${opts.qs?'&'+opts.qs:''}`;
  const headers = opts.body ? {'Content-Type':'application/json'} : {};
  if(ADMIN_PASSWORD){
    headers['x-admin-password'] = ADMIN_PASSWORD; // tried as the master password first
    headers['x-password'] = ADMIN_PASSWORD;        // also tried as this account's own password
  }
  if(CURRENT_USERNAME) headers['x-username'] = CURRENT_USERNAME;
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    // Forces the browser to bypass its HTTP cache entirely and always hit
    // the server fresh — without this, the browser can send a conditional
    // request (If-None-Match) and reuse a stale cached response (304 Not
    // Modified) even when the underlying data has genuinely changed, which
    // would look exactly like "I saved but it still shows the old data."
    cache: 'no-store'
  });
  if(res.status === 401){ AUTH_FAILED = true; throw new Error('Unauthorized — wrong or missing credentials'); }
  if(res.status === 403){ throw new Error('Read-only account — admin permission required to save changes.'); }
  AUTH_FAILED = false;
  if(!res.ok) throw new Error(`API ${resource} failed: ${res.status}`);
  return res.json();
}
// Pulls the combined, read-only Portal snapshot (assignments + per-handler
// incentives) via Coverage Desk's own backend, which proxies the actual
// Apps Script bridge call server-side so the portal secret never reaches
// the browser.
//
// mode 'today'  -> fast: only this date's calls (few seconds), auto-polled
// mode 'full'   -> slow: the entire call history (~20s), manual only
async function fetchPortalSync(mode){
  if(!API_BASE_URL){ state.portalSyncError = 'Portal sync requires the app to be connected to the database backend.'; render(); return; }
  if((mode || state.portalSyncMode) === 'today' && !isViewingToday()){
    state.portalSyncError = `Sync Today only works while viewing today's date — you're currently on ${state.date}. Switch to today first, or use Full Sync for historical data.`;
    render();
    return;
  }
  state.portalSyncMode = mode || state.portalSyncMode || 'today';
  state.portalSyncLoading = true;
  render();
  try{
    const dateQs = state.portalSyncMode === 'today' ? ('&date=' + encodeURIComponent(state.date)) : '';
    const [assignmentsResult, incentivesResult] = await Promise.all([
      apiCall('portal_sync', {qs:'type=assignments' + dateQs}),
      apiCall('portal_sync', {qs:'type=incentives'})
    ]);
    state.portalSyncData = {
      assignments: assignmentsResult.data || [],
      incentives: incentivesResult.data || null
    };
    state.portalSyncUpdatedAt = Date.now();
    state.portalSyncError = '';
  }catch(e){
    state.portalSyncError = e && e.message ? e.message : 'Could not reach the Portal sync bridge.';
  }
  state.portalSyncLoading = false;
  render();
}
// Shows whatever was last saved in the database instantly, without
// waiting on the slow Apps Script bridge — used the moment the panel
// opens, before the person even asks for a fresh pull.
async function loadPortalSyncCache(){
  if(!API_BASE_URL) return;
  try{
    const dateQs = '&date=' + encodeURIComponent(state.date);
    const [assignmentsResult, incentivesResult] = await Promise.all([
      apiCall('portal_sync', {qs:'type=assignments&cached=1' + dateQs}),
      apiCall('portal_sync', {qs:'type=incentives&cached=1'})
    ]);
    if(assignmentsResult.data || incentivesResult.data){
      state.portalSyncData = {
        assignments: assignmentsResult.data || [],
        incentives: incentivesResult.data || null
      };
      state.portalSyncUpdatedAt = assignmentsResult.generatedAt ? new Date(assignmentsResult.generatedAt).getTime() : null;
      state.portalSyncFromCache = true;
      render();
    }
  }catch(e){ /* cache is best-effort; a manual sync still works without it */ }
}
function startPortalSyncPolling(){
  stopPortalSyncPolling();
  loadPortalSyncCache().then(()=>{ fetchPortalSync('today'); });
  portalSyncTimer = setInterval(()=>{
    if(state.portalSyncMode === 'today') fetchPortalSync('today');
  }, 30000);
}
function stopPortalSyncPolling(){
  if(portalSyncTimer){ clearInterval(portalSyncTimer); portalSyncTimer = null; }
}

async function loadRoster(){
  if(API_BASE_URL){
    try{
      const data = await apiCall('roster', {});
      state.roster = (data.rows && data.rows.length) ? data.rows : DEFAULT_ROSTER.slice();
      state.needsLogin = false;
      return;
    }catch(e){
      if(AUTH_FAILED){ state.needsLogin = true; return; } // don't silently fall back to stale local data
    }
  }
  try{
    const r = await storageAdapter.get('roster', false);
    let parsed = r && r.value ? JSON.parse(r.value) : DEFAULT_ROSTER.slice();
    // migrate old string-array roster format if present
    if(parsed.length && typeof parsed[0] === 'string'){
      parsed = parsed.map(name=>({id:uid(), name, team:'Unassigned', advanced:false}));
    }
    state.roster = parsed;
  }catch(e){ state.roster = DEFAULT_ROSTER.slice(); }
}
async function saveRoster(){
  if(API_BASE_URL){
    // Do NOT silently fall back to local storage on a backend failure — that
    // was the actual bug: a failed save would quietly succeed into the
    // browser's local cache only, the UI would claim "All saved", and the
    // change would vanish on refresh since loading always prefers the
    // backend. A real failure here needs to surface, not hide.
    await apiCall('roster', {method:'POST', body:{rows: state.roster}});
    return;
  }
  await storageAdapter.set('roster', JSON.stringify(state.roster), false);
}

// ---------- Students Master (the full active-student roster, separate
// from state.roster which is just coordinators/team members) ----------
// Seeded once from an uploaded spreadsheet, then lives independently —
// used to recognize/validate candidate names during a WhatsApp import and
// to surface a student's domain, assigned counselor, visa, etc. at a
// glance. Follows the same "try backend, fall back to local" shape as
// loadRoster, but ALSO tolerates the backend simply not having this
// endpoint yet (a brand-new feature, not yet in api/data.js) — that case
// is flagged via studentsMasterBackendMissing so the panel can say so
// plainly instead of silently pretending everything's synced.
async function loadStudentsMaster(){
  function seedFromSpreadsheet(){
    return DEFAULT_STUDENTS_SEED.map(s => ({ id: uid(), name: s.n, country: s.c }));
  }
  if(API_BASE_URL){
    try{
      const data = await apiCall('students', {});
      if(data.rows && data.rows.length){
        state.studentsMaster = data.rows;
      } else {
        // Backend reachable and the endpoint exists, but no rows saved
        // yet — seed it once from the spreadsheet and persist that.
        state.studentsMaster = seedFromSpreadsheet();
        await saveStudentsMaster();
      }
      state.studentsMasterLoaded = true;
      state.studentsMasterBackendMissing = false;
      return;
    }catch(e){
      // Most likely: this backend doesn't have a 'students' resource yet.
      state.studentsMasterBackendMissing = true;
    }
  }
  try{
    const r = await storageAdapter.get('students-master', false);
    const parsed = r && r.value ? JSON.parse(r.value) : null;
    state.studentsMaster = (parsed && parsed.length) ? parsed : seedFromSpreadsheet();
  }catch(e){
    state.studentsMaster = seedFromSpreadsheet();
  }
  try{ await storageAdapter.set('students-master', JSON.stringify(state.studentsMaster), false); }catch(e){}
  state.studentsMasterLoaded = true;
}
async function saveStudentsMaster(){
  if(API_BASE_URL){
    try{
      await apiCall('students', {method:'POST', body:{rows: state.studentsMaster}});
      state.studentsMasterBackendMissing = false;
    }catch(e){
      state.studentsMasterBackendMissing = true;
      // Fall through to local storage too, so at least this browser keeps
      // the edit until the backend endpoint exists.
      try{ await storageAdapter.set('students-master', JSON.stringify(state.studentsMaster), false); }catch(e2){}
    }
    return;
  }
  try{ await storageAdapter.set('students-master', JSON.stringify(state.studentsMaster), false); }catch(e){}
}
// Strips everything but letters before comparing — same idea as
// normalizeCompanyKey — so a name typed slightly differently in a
// WhatsApp paste ("Keerththana" vs "Keerthana", extra spacing, etc.)
// still matches the spreadsheet entry.
function normalizeNameKey(name){
  return (name||'').toLowerCase().replace(/[^a-z]/g,'');
}
// Standard edit distance — used only for the bounded typo-tolerance check
// below, never for anything with real stakes (like Portal handler matching).
function levenshteinDistance(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  let prev = new Array(n+1), curr = new Array(n+1);
  for(let j=0;j<=n;j++) prev[j] = j;
  for(let i=1;i<=m;i++){
    curr[0] = i;
    for(let j=1;j<=n;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr[j] = Math.min(prev[j]+1, curr[j-1]+1, prev[j-1]+cost);
    }
    const tmp = prev; prev = curr; curr = tmp;
  }
  return prev[n];
}
function findStudentMasterMatch(candidateName){
  const key = normalizeNameKey(candidateName);
  if(!key || !state.studentsMaster) return null;
  const exact = state.studentsMaster.find(s => normalizeNameKey(s.name) === key);
  if(exact) return exact;
  // WhatsApp messages very often abbreviate to "First L." (e.g. "Sushmitha
  // B" for "Sushmitha Basavaraju"). Only resolve this when it's completely
  // unambiguous — if more than one master-list student shares that exact
  // first name AND last-name initial, this returns null rather than guess,
  // same principle as the Karthik/Karthikeya incident: under-matching is
  // safe, silently conflating two different real people is not.
  const parts = (candidateName||'').trim().split(/\s+/);
  if(parts.length === 2 && /^[A-Za-z]\.?$/.test(parts[1])){
    const firstNameKey = normalizeNameKey(parts[0]);
    const initial = parts[1][0].toLowerCase();
    const candidates = state.studentsMaster.filter(s=>{
      const sParts = (s.name||'').trim().split(/\s+/);
      if(sParts.length < 2) return false;
      return normalizeNameKey(sParts[0]) === firstNameKey &&
             sParts[sParts.length-1][0].toLowerCase() === initial;
    });
    if(candidates.length === 1) return candidates[0];
  }
  // Small typo tolerance — catches things like "Chigdhana Hemantharaju"
  // typed in a WhatsApp message vs the master list's actual "Chidghana
  // Hemantharaju" (two adjacent letters swapped). Only applied to longer
  // names, since a couple of edits on a short name is far too likely to be
  // a coincidence rather than a typo; capped at 2 edits; and — same rule
  // as the abbreviation case above — only resolves when exactly one
  // master-list student is that close. Ambiguous or nothing close enough
  // means no match, never a guess.
  if(key.length >= 10){
    const closeMatches = [];
    for(const s of state.studentsMaster){
      const sKey = normalizeNameKey(s.name);
      if(Math.abs(sKey.length - key.length) > 2) continue;
      if(levenshteinDistance(key, sKey) <= 2){
        closeMatches.push(s);
        if(closeMatches.length > 1) break; // already ambiguous — stop early
      }
    }
    if(closeMatches.length === 1) return closeMatches[0];
  }
  return null;
}
function todayDateString(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
async function loadDay(dateStr){
  if(API_BASE_URL){
    try{
      const [callsData, notesData, finalData, statusData] = await Promise.all([
        apiCall('calls', {qs:'date='+dateStr}),
        apiCall('notes', {qs:'date='+dateStr}),
        apiCall('finalized', {qs:'date='+dateStr}),
        // Reschedule/cancel tags live in their own table now, loaded and
        // merged separately from the plain call rows above. If handleCalls'
        // JOIN already attached them, this just confirms/overwrites with the
        // same data; if the backend is an older deployment without the JOIN,
        // this is what actually brings the tags back after a refresh.
        apiCall('call_status', {qs:'date='+dateStr}).catch(()=>({rows:[]}))
      ]);
      state.rows = callsData.rows || [];
      const statusById = {};
      (statusData.rows||[]).forEach(s=>{ statusById[s.callId] = s; });
      state.rows.forEach(r=>{
        const s = statusById[r.id];
        if(s){ r.status = s.status; r.statusFields = s.statusFields || []; }
      });
      state.notes = notesData.rows || [];
      state.finalized = !!finalData.finalized;
      state.needsLogin = false;
      syncShiftNoteFromNotes(); syncAbsentFromNotes(); syncExportedIdsFromNotes();
      // Clear first so a previous date's Portal data can't linger while
      // this date's own snapshot (if any) loads in.
      state.portalAssignments = null;
      if(dateStr === todayDateString()){
        // Today's date specifically stays manual-only — data is still
        // actively changing, and given open questions about occasional
        // cross-team accuracy, showing nothing by default is safer than
        // auto-showing something that might be stale or wrong. Click a
        // sync button to pull it deliberately.
      } else {
        // Past dates are more settled, so showing the last-saved snapshot
        // automatically (no live Apps Script call, just a fast DB read)
        // is genuinely helpful rather than risky.
        loadCachedPortalAssignmentsForDate(dateStr);
      }
      return;
    }catch(e){
      if(AUTH_FAILED){ state.needsLogin = true; return; } // don't silently fall back to stale local data
    }
  }
  try{
    const r = await storageAdapter.get('day:'+dateStr, false);
    const parsed = r && r.value ? JSON.parse(r.value) : null;
    if(Array.isArray(parsed)){ state.rows = parsed; state.finalized = false; state.notes = []; }
    else if(parsed){ state.rows = parsed.rows || []; state.finalized = !!parsed.finalized; state.notes = parsed.notes || []; }
    else { state.rows = []; state.finalized = false; state.notes = []; }
  }catch(e){ state.rows = []; state.finalized = false; state.notes = []; }
  syncShiftNoteFromNotes(); syncAbsentFromNotes(); syncExportedIdsFromNotes();
}
// Saves the reschedule/cancel tags for the current date to the dedicated
// call_status table — a full replace of everything currently tagged for
// this date (mirrors the delete-then-insert pattern used for notes/roster).
// This never touches the `calls` table, so it can't be lost to a stale
// deployment or a missing column there, and a routine call edit elsewhere
// can't wipe it out either.
async function saveCallStatuses(){
  if(!API_BASE_URL) return; // local-storage mode already keeps status embedded on the row itself
  const payload = state.rows.filter(r=>r.status).map(r=>({
    callId: r.id,
    status: r.status,
    reason: (r.statusFields||[]).find(f=>f.label==='Reason')?.value || '',
    statusFields: r.statusFields || [],
  }));
  await apiCall('call_status', {method:'POST', body:{date: state.date, rows: payload}});
}
// Deliberately its own narrow resource, separate from the main calls save —
// a Team Lead account is otherwise fully read-only, and this is the one
// field they're allowed to write. Keeping it on its own endpoint means the
// backend can permit exactly this one narrow update for that role without
// opening up write access to anything else (time, candidate, assignee,
// etc.) — the restriction is enforced server-side, not just hidden in the UI.

// The "note for next shift" box reuses the existing notes table/resource —
// stored as one special entry per date rather than a whole new backend
// endpoint, since that infrastructure already exists and works. The id is
// prefixed with the date (not just the fixed string 'shift-note') because
// the notes table's primary key is on `id` alone, not (id, note_date) — a
// bare 'shift-note' id would collide with the row left behind from any
// other date the moment you tried to save a second day, causing a
// "Duplicate entry ... for key 'notes.PRIMARY'" error on save.
function shiftNoteId(){ return state.date + '-shift-note'; }
function absentIdsNoteId(){ return state.date + '-absent-ids'; }
function exportedIdsNoteId(){ return state.date + '-exported-ids'; }
function syncShiftNoteFromNotes(){
  const entry = (state.notes||[]).find(n => n && n.id === shiftNoteId());
  state.shiftNote = entry ? (entry.text||'') : '';
}
function syncNotesFromShiftNote(){
  state.notes = state.notes || [];
  const idx = state.notes.findIndex(n => n && n.id === shiftNoteId());
  if(state.shiftNote && state.shiftNote.trim()){
    if(idx >= 0) state.notes[idx].text = state.shiftNote;
    else state.notes.push({ id:shiftNoteId(), text: state.shiftNote });
  } else if(idx >= 0){
    state.notes.splice(idx, 1);
  }
}
// Absences — same reused-notes trick as the shift note, scoped to THIS date
// specifically (not the roster globally), since being absent is a today-only
// thing, not a permanent roster change. Stored as one special entry per date
// holding a JSON array of roster person IDs marked absent.
function syncAbsentFromNotes(){
  const entry = (state.notes||[]).find(n => n && n.id === absentIdsNoteId());
  try{ state.absentIds = entry ? (JSON.parse(entry.text)||[]) : []; }
  catch(e){ state.absentIds = []; }
}
function syncNotesFromAbsent(){
  state.notes = state.notes || [];

  if(state.absentIds && state.absentIds.length){

}

// Edits now stay local until the person explicitly clicks Save — nothing they
// type or change is visible to anyone else (or persists across a refresh)
// until that happens. This avoids half-finished edits going live mid-typing.
function markDirty(){
  state.dirty = true;
  // Any edit made after finalizing means the finalized .txt no longer reflects
  // the current data — automatically un-finalize so the button correctly goes
  // back to "Finalize all calls" instead of staying stuck on "Open .txt" with
  // no clear way back to re-finalizing the updated list.
  if(state.finalized) state.finalized = false;
}
async function saveAllChanges(){
  state.saving = true;
  state.saveError = '';
  render();
  const sentRowCount = state.rows.length; // snapshot for verification below
  const sentDate = state.date;
  try{
    await Promise.all([saveDayNow(), saveRoster()]);
    state.dirty = false;
    // Closes the loop instead of just trusting the POST succeeded:
    // immediately re-fetch this date's calls from the database and
    // confirm the count matches what was just sent. A 200 response
    // doesn't guarantee the write actually landed correctly — this
    // catches a mismatch the moment it happens instead of someone
    // noticing missing calls the next time they open this date.
    if(API_BASE_URL){
      try{
        const verify = await apiCall('calls', {qs:'date='+encodeURIComponent(sentDate)});
        const savedCount = (verify.rows||[]).length;
        if(savedCount !== sentRowCount){
          state.saveError = `⚠ Save verification failed: sent ${sentRowCount} call(s) but the database now shows ${savedCount} for ${sentDate}. Please refresh and check carefully before continuing — do not assume the save worked.`;
          state.dirty = true;
        }
      }catch(e){
        // Couldn't verify — doesn't necessarily mean the save failed, just
        // that we can't confirm it right now. Don't block on this alone.
      }
    }
  }catch(e){
    // A real failure — keep dirty=true so the Save button still correctly
    // shows there's unsaved work, and surface a clear error instead of
    // quietly claiming success while the change never actually reached the
    // shared database.
    state.saveError = 'Save failed: ' + (e && e.message ? e.message : 'could not reach the server. Your changes are NOT saved yet — try Save again.');
  }
  state.saving = false;
  render();
}
function saveDaySoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDayNow, 400);
}
async function saveDayNow(){
  syncNotesFromShiftNote(); syncNotesFromAbsent(); syncNotesFromExportedIds();
  if(API_BASE_URL){
    // Same fix as saveRoster() above — a failed backend save must surface as
    // a real failure, not silently succeed into local-only storage while the
    // UI claims everything is saved.
    await Promise.all([
      apiCall('calls', {method:'POST', body:{date: state.date, rows: state.rows}}),
      apiCall('notes', {method:'POST', body:{date: state.date, rows: state.notes}}),
      apiCall('finalized', {method:'POST', body:{date: state.date, finalized: state.finalized}})
    ]);
    return;
  }
  await storageAdapter.set('day:'+state.date, JSON.stringify({rows: state.rows, finalized: state.finalized, notes: state.notes}), false);
  const idx = await storageAdapter.get('known-dates', false).catch(()=>null);
  const list = idx && idx.value ? JSON.parse(idx.value) : [];
  if(!list.includes(state.date)){
    list.push(state.date);
    await storageAdapter.set('known-dates', JSON.stringify(list), false);
  }
}
// Saves new rows straight into a date OTHER than whatever is currently
// open — used when one pasted list contains a "Call's for tomorrow
// (DATE)" section splitting it across several days. Fetches that date's
// existing calls first so nothing gets overwritten, runs the same
// auto-routing against THAT date's own existing rows (not today's), then
// saves the merged result. Returns the new total row count for that date.
// Snapshots the CURRENT state of a date's calls before a risky operation
// (import, clear all, finalize) — a real recovery point independent of
// whatever bug might cause data loss, since it's not relying on the same
// save path that could be the thing going wrong. Best-effort: a failed
// backup should never block the actual operation the person is trying to
// do, just gets logged to the console.
async function createBackup(reason, dateKey, rows){
  if(!API_BASE_URL) return;
  try{
    await apiCall('call_backups', {method:'POST', body:{date: dateKey || state.date, reason, rows: rows || state.rows}});
  }catch(e){
    console.error('Backup failed (operation continuing anyway):', e);
  }
}
async function loadBackupsList(dateKey){
  if(!API_BASE_URL) return [];
  try{
    const result = await apiCall('call_backups', {qs:'date='+encodeURIComponent(dateKey || state.date)});
    return result.backups || [];
  }catch(e){ return []; }
}
async function restoreBackup(backupId){
  const result = await apiCall('call_backups', {qs:'id='+encodeURIComponent(backupId)});
  const backup = result.backup;
  if(!backup) throw new Error('Backup not found');
  let rows;
  try{ rows = JSON.parse(backup.snapshot_json); }catch(e){ throw new Error('Backup data is corrupted'); }
  return { rows, callDate: backup.call_date, reason: backup.reason, createdAt: backup.created_at };
}
async function saveRowsToOtherDate(targetDateKey, newRows){
  if(API_BASE_URL){
    const existing = await apiCall('calls', {qs:'date='+targetDateKey}).catch(()=>({rows:[]}));
    const existingRows = existing.rows || [];
    const routed = autoRouteRows(newRows, existingRows);
    const merged = existingRows.concat(routed);
    await apiCall('calls', {method:'POST', body:{date: targetDateKey, rows: merged}});
    return merged.length;
  }
  const r = await storageAdapter.get('day:'+targetDateKey, false).catch(()=>null);
  const parsedExisting = r && r.value ? JSON.parse(r.value) : null;
  const existingRows = Array.isArray(parsedExisting) ? parsedExisting : (parsedExisting && parsedExisting.rows) || [];
  const routed = autoRouteRows(newRows, existingRows);
  const merged = existingRows.concat(routed);
  const payload = (parsedExisting && !Array.isArray(parsedExisting)) ? {...parsedExisting, rows: merged} : {rows: merged, finalized:false, notes:[]};
  await storageAdapter.set('day:'+targetDateKey, JSON.stringify(payload), false);
  const idx = await storageAdapter.get('known-dates', false).catch(()=>null);
  const list = idx && idx.value ? JSON.parse(idx.value) : [];
  if(!list.includes(targetDateKey)){
    list.push(targetDateKey);
    await storageAdapter.set('known-dates', JSON.stringify(list), false);
  }
  return merged.length;
}
// Moves the currently-selected rows OUT of today's list and INTO a
// different date entirely, preserving their assignee/round/etc as-is
// (a relocation, not a re-route) — exactly what's needed when calls got
// saved under the wrong date by mistake. Both the source and target
// dates are backed up first, since this touches two dates at once.
async function moveSelectedRowsToDate(targetDateKey){
  const idsToMove = new Set(state.selectedIds);
  const rowsToMove = state.rows.filter(r => idsToMove.has(r.id));
  if(!rowsToMove.length) return { movedCount: 0, targetTotal: 0 };

  await createBackup('pre-move-out', state.date, state.rows);

  let targetRows = [];
  if(API_BASE_URL){
    const existing = await apiCall('calls', {qs:'date='+encodeURIComponent(targetDateKey)}).catch(()=>({rows:[]}));
    targetRows = existing.rows || [];
  } else {
    const r = await storageAdapter.get('day:'+targetDateKey, false).catch(()=>null);
    const parsedExisting = r && r.value ? JSON.parse(r.value) : null;
    targetRows = Array.isArray(parsedExisting) ? parsedExisting : (parsedExisting && parsedExisting.rows) || [];
  }
  await createBackup('pre-move-in', targetDateKey, targetRows);

  const merged = targetRows.concat(rowsToMove);
  if(API_BASE_URL){
    await apiCall('calls', {method:'POST', body:{date: targetDateKey, rows: merged}});
  } else {
    const r = await storageAdapter.get('day:'+targetDateKey, false).catch(()=>null);
    const parsedExisting = r && r.value ? JSON.parse(r.value) : null;
    const payload = (parsedExisting && !Array.isArray(parsedExisting)) ? {...parsedExisting, rows: merged} : {rows: merged, finalized:false, notes:[]};
    await storageAdapter.set('day:'+targetDateKey, JSON.stringify(payload), false);
    const idx = await storageAdapter.get('known-dates', false).catch(()=>null);
    const list = idx && idx.value ? JSON.parse(idx.value) : [];
    if(!list.includes(targetDateKey)){ list.push(targetDateKey); await storageAdapter.set('known-dates', JSON.stringify(list), false); }
  }

  state.rows = state.rows.filter(r => !idsToMove.has(r.id));
  state.selectedIds.clear();
  markDirty();
  render();
  await saveAllChanges();

  return { movedCount: rowsToMove.length, targetTotal: merged.length };
}

// ---------- time helpers ----------
function timeToMinutes(t){
  if(!t) return 9999;
  // has an explicit AM/PM marker anywhere -> parse directly (handles "12.30 AM", "1 AM", "2:30 PM" etc)
  let m = t.match(/(\d{1,2})(?:[:.](\d{2}))?\s*([AaPp][Mm])/);
  if(m){
    let h = parseInt(m[1],10)%12;
    if(/PM/i.test(m[3])) h += 12;
    const min = m[2] ? parseInt(m[2],10) : 0;
    return h*60+min;
  }
  // no AM/PM given anywhere in the raw text (kept exactly as pasted) — heuristic for
  // sort order only, never shown: hours 1-11 sort as PM, 12 sorts as just-after-midnight
  m = t.match(/^(\d{1,2})(?:[:.](\d{2}))?/);
  if(m){
    let h = parseInt(m[1],10);
    let min = m[2] ? parseInt(m[2],10) : 0;
    if(h===12) return min;
    if(h>=1 && h<=11) return (h+12)*60+min;
  }
  return 9999;
}
// The actual work day here runs 1:30 PM -> midnight -> 2 AM, not midnight -> midnight.
// timeToMinutes() alone sorts AM times (0-711) before PM times (720-1439), which puts
// early-morning calls at the very TOP of the list — backwards from how the day actually
// runs. This re-bases the sort key to start at noon, so PM comes first and AM trails
// after, matching the real chronological order of the day. Only used for sort ordering
// — never shown, never affects the displayed time text.
function businessDayMinutes(t){
  const m = timeToMinutes(t);
  if(m===9999) return 9999;
  return (m + 720) % 1440;
}
function hourBucketLabel(mins){
  if(mins===9999) return '?';
  let h = Math.floor(mins/60);
  const suffix = h>=12?'PM':'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return h12+suffix;
}
// Same idea as hourBucketLabel() but at half-hour precision ("2:00PM",
// "2:30PM") instead of just the hour — the coverage graph needs this so
// "how many calls at 10:00 vs 10:30" is actually answerable at a glance.
function halfHourBucketLabel(mins){
  if(mins===9999) return '?';
  let h = Math.floor(mins/60);
  const m = mins % 60;
  const suffix = h>=12?'PM':'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return h12+':'+String(m).padStart(2,'0')+suffix;
}

// ---------- parsing WhatsApp text ----------
function titleCase(s){
  return (s||'').replace(/\w\S*/g, w => w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());
}
function normalizeTeamName(text){
  if(/hyd/i.test(text)) return 'HYD Team';
  if(/pradeep/i.test(text)) return 'Pradeep Anna Team';
  if(/development/i.test(text)) return 'Development Team';
  if(/marketing/i.test(text)) return 'Marketing Team';
  return null;
}
function matchRosterName(name){
  const found = state.roster.find(p=>p.name.toLowerCase()===name.toLowerCase());
  return found ? found.name : titleCase(name);
}
function matchOrCreateRosterName(name){
  const found = state.roster.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(found) return found.name;
  const canonical = titleCase(name);
  state.roster.push({id:uid(), name:canonical, team:'Needs Team Assignment', advanced:true});
  return canonical;
}
function countryFromParens(parens){
  const p = (parens||[]).find(x=>/^(uk|ireland|canada|germany)$/i.test((x||'').trim()));
  if(!p) return 'USA';
  const t = p.trim().toLowerCase();
  return t==='uk' ? 'UK' : (t.charAt(0).toUpperCase()+t.slice(1));
}
const MONTH_ABBR_MAP = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
// Matches section headers like "Call's for tomorrow (2nd Sep)" that split
// one pasted list into calls for several different dates — a real pattern
// in the source WhatsApp text that was previously invisible to the parser
// entirely (the line itself would just become a garbage row, and every
// call under it got dumped into whichever date happened to be open in
// Coverage Desk, silently mixing days together).
function parseDateSectionHeader(line, baseDate){
  const m = line.match(/call'?s?\s+for\s+tomorrow\s*\(\s*(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,9})\s*\)/i);
  if(!m) return null;
  const day = parseInt(m[1],10);
  const monthIdx = MONTH_ABBR_MAP[m[2].slice(0,3).toLowerCase()];
  if(monthIdx === undefined || !day) return null;
  const baseYear = new Date(baseDate).getFullYear();
  const d = new Date(baseYear, monthIdx, day);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseHeaderLine(line){
  const trimmed = line.trim();
  let m = trimmed.match(/^\*(.+?)\*$/);
  if(m){
    const raw = m[1].trim();
    return { type:'team', value: normalizeTeamName(raw) || titleCase(raw) };
  }
  // Only treat "@Name" as a plain header when the ENTIRE line is just a
  // short name — letters/spaces/periods, nothing else. Real reschedule/
  // reason lines look like "@Sashank Bava Sir, Nikhil Adhikrao Yadav
  // (Ireland) - 4:30 PM Call rescheduled..." — that's substantive call
  // data, not a header, and matching it here used to discard the entire
  // line with zero trace, not even a doubt. Requiring the whole line to
  // be just a name (no digits, dashes, commas, parens) means anything
  // with real content correctly falls through to normal parsing instead.

  const paRaw = state.roster.filter(p=>p.team==='Pradeep Anna Team').length || 8;
  const hydAbsentCount = state.roster.filter(p=>p.team==='HYD Team' && state.absentIds.includes(p.id)).length;

function parseDurationMinutes(text){

  const hrMatch = t.match(/([\d.]+)\s*(hr|hrs|hour|hours)/);
  const minMatch = t.match(/([\d.]+)\s*(min|mins|minute|minutes)/);
  if(hrMatch){ total += parseFloat(hrMatch[1])*60; found = true; }
  if(minMatch){ total += parseFloat(minMatch[1]); found = true; }
  if(!found){
    const bare = t.match(/^([\d.]+)$/);
    if(bare){ total = parseFloat(bare[1]); found = true; }
  }
  return found && total>0 ? total : null;
