<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// Applied as early as possible (before the stylesheet paints anything) so
// switching to light mode doesn't show a flash of the dark theme first on
// every load. Best-effort: if localStorage is blocked (private browsing,
// cleared site data), this silently falls back to dark, same as before
// light mode existed.
try{
  if(localStorage.getItem('coverage-desk-theme') === 'light'){
    document.documentElement.setAttribute('data-theme', 'light');
  }
}catch(e){}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coverage Desk">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Coverage Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Global "working…" indicator — a thin bar that appears whenever ANY
     network request is in flight (apiCall wraps every one). Lives outside
     #app so render()'s full innerHTML rebuild never touches it, and is
     toggled by a plain class swap (see setNetworkBusy below) rather than a
     full render() — instant, and doesn't cost another ~230ms render just to
     show that something is loading. This is what most buttons were
     missing: without it, a click that triggers a slow server round-trip
     just sits there looking frozen with no feedback at all. -->
<div id="globalBusyBar" class="global-busy-bar" aria-hidden="true"></div>
<div id="pullRefreshIndicator" class="pull-refresh-indicator" aria-hidden="true"><span class="pull-refresh-icon" id="pullRefreshIcon">↓</span></div>
<div class="app" id="app"><div style="padding-top:8px">
  <div class="skeleton-stat-row"><div class="skeleton-stat-card"></div><div class="skeleton-stat-card"></div><div class="skeleton-stat-card"></div><div class="skeleton-stat-card"></div></div>
  <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
  <div class="loading-block" style="padding-top:4px"><span class="spinner"></span><span>Loading Coverage Desk…</span></div>
</div></div>
<button id="scrollToTopBtn" class="scroll-to-top-btn" title="Scroll to top" aria-label="Scroll to top">↑</button>
<div id="installBanner" class="install-banner" style="display:none">
  <span class="install-banner-icon">📲</span>
  <span class="install-banner-text" id="installBannerText">Install Coverage Desk for quick access, like a real app.</span>
  <button id="installBannerActionBtn" class="install-banner-action">Install</button>
  <button id="installBannerDismissBtn" class="install-banner-dismiss" title="Dismiss" aria-label="Dismiss">✕</button>
</div>
<nav class="bottom-nav" id="bottomNav">
  <button class="bottom-nav-item" id="navHome" data-nav="home">
    <span class="bottom-nav-icon">🏠</span><span class="bottom-nav-label">Calls</span>
  </button>
  <button class="bottom-nav-item" id="navAlerts" data-nav="alerts">
    <span class="bottom-nav-icon">🔔</span><span class="bottom-nav-label">Alerts</span>
    <span class="bottom-nav-dot" id="navAlertsDot" style="display:none"></span>
  </button>
  <button class="bottom-nav-item bottom-nav-fab" id="navAdd" data-nav="add" title="Add a call">
    <span class="bottom-nav-fab-icon">＋</span>
  </button>
  <button class="bottom-nav-item" id="navTools" data-nav="tools">
    <span class="bottom-nav-icon">🔧</span><span class="bottom-nav-label">Admin</span>
  </button>
  <button class="bottom-nav-item" id="navMore" data-nav="more">
    <span class="bottom-nav-icon">📊</span><span class="bottom-nav-label">Reports</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
